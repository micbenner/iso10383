# .github/workflows/update-mic-daily.yml
name: Daily MIC Update

on:
  schedule:
    - cron: '0 9 * * *'        # Every day at 09:00 UTC
  workflow_dispatch:

jobs:
  update-mic-list:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '7.4'
          tools: composer

      - name: Install Composer dependencies
        run: composer install --no-progress --no-interaction --dev

      - name: Refresh exchanges (update MIC list)
        run: composer refresh-exchanges

      - name: Commit & push if the data changed
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update MIC list to latest ISO 10383 release"
          file_pattern: src/AutoGenerated_Exchanges.php
          commit_user_name: github-actions[bot]
          commit_user_email: github-actions[bot]@users.noreply.github.com
